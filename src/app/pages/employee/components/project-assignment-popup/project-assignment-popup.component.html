<div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl border border-slate-100 shadow-2xl p-6 max-w-md w-full text-slate-800">
    <h3 class="text-xl font-extrabold text-slate-900 mb-4 pb-2 border-b border-slate-100">
      Assign Projects - {{ employee?.EmpName }}
    </h3>
    
    <!-- Select drop down -->
    <div class="mb-4">
      <label class="block text-xs font-semibold text-slate-600 mb-2">Select Project</label>
      <select (change)="onProjectSelectChange($event)" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-slate-900 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500">
        <option value="">-- Choose a project to add --</option>
        <option *ngFor="let proj of allProjects" [value]="proj.ProjectId">{{ proj.ProjectName }}</option>
      </select>
      <div *ngIf="errorMessage" class="text-xs text-rose-500 mt-1 font-semibold">
        {{ errorMessage }}
      </div>
    </div>
    
    <!-- List of selected projects -->
    <div class="mb-6">
      <label class="block text-xs font-semibold text-slate-600 mb-2">Assigned Projects (Max 3)</label>
      <div *ngIf="selectedProjects.length === 0" class="text-sm text-slate-400 italic py-4 text-center border border-dashed border-slate-200 rounded-2xl">
        No projects selected.
      </div>
      <div *ngIf="selectedProjects.length > 0" class="space-y-2">
        <div *ngFor="let id of selectedProjects" class="flex justify-between items-center bg-slate-50 border border-slate-100 p-3 rounded-2xl">
          <span class="text-sm font-semibold text-slate-700">{{ getProjectName(id) }}</span>
          <button type="button" (click)="removeProject(id)" class="text-xs font-bold text-rose-500 hover:text-rose-700 hover:underline">
            Remove
          </button>
        </div>
      </div>
    </div>
    
    <!-- Action buttons -->
    <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
      <button type="button" (click)="onCancel()" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-100 transition duration-150">
        Cancel
      </button>
      <button type="button" (click)="onSave()" class="rounded-xl bg-violet-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-violet-700 transition duration-150">
        Save Assignments
      </button>
    </div>
  </div>
</div>

<div class="bg-white/95 border border-slate-200 rounded-3xl shadow-lg p-6 h-fit sticky top-4">
  <h2 class="text-xl font-bold text-slate-900 mb-4">{{ isEditMode ? 'Update Employee' : 'Add New Employee' }}</h2>
  <form [formGroup]="updateForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-2">Name</label>
      <input
        type="text"
        formControlName="EmpName"
        placeholder="Enter full name"
        class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-slate-900 focus:outline-none focus:border-slate-500 focus:ring-1 "
      />
      <div *ngIf="updateForm.get('EmpName')?.touched && updateForm.get('EmpName')?.invalid" class="text-xs text-rose-500 mt-1">
        Name is required (min 2 chars).
      </div>
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-2">Email</label>
      <input
        type="email"
        formControlName="EmpEmail"
        placeholder="Enter email"
        class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-slate-900 focus:outline-none focus:border-slate-500 focus:ring-1 "
      />
      <div *ngIf="updateForm.get('EmpEmail')?.touched && updateForm.get('EmpEmail')?.invalid" class="text-xs text-rose-500 mt-1">
        Provide a valid email address.
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-2">Age</label>
        <input
          type="number"
          formControlName="EmpAge"
          placeholder="18"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-slate-900 focus:outline-none focus:border-slate-500 focus:ring-1 "
        />
        <div *ngIf="updateForm.get('EmpAge')?.touched && updateForm.get('EmpAge')?.invalid" class="text-xs text-rose-500 mt-1">
          Must be between 18 and 100.
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-2">Joining Date</label>
        <input
          type="date"
          formControlName="DateOfJoining"
          [max]="today"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-slate-900 focus:outline-none focus:border-slate-500 focus:ring-1 "
        />
      </div>
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-2">Department</label>
      <select
        formControlName="DepartmentId"
        class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-slate-900 focus:outline-none focus:border-slate-500 focus:ring-1 "
      >
        <option value="" disabled>Select department</option>
        <option *ngFor="let dept of departments" [value]="dept.DeptId">{{ dept.DeptName }}</option>
      </select>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="button" (click)="onClear()" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-100 transition duration-150">
        Clear
      </button>
      <button type="submit" [disabled]="isSubmitting" class="w-full rounded-xl bg-emerald-500 px-4 py-2.5 text-sm font-semibold text-white hover:bg-emerald-600 transition duration-150 disabled:opacity-50">
        {{ isEditMode ? 'Update' : 'Create' }}
      </button>
    </div>
  </form>
</div>

<div class="bg-white border border-slate-200 rounded-3xl shadow-sm overflow-hidden">
  
  <!-- Empty State -->
  <div *ngIf="employees.length === 0" class="py-16 px-4 text-center">
    <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="h-8 w-8 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
    </div>
    <h3 class="text-base font-bold text-slate-800">No Employees Found</h3>
    <p class="text-sm text-slate-400 mt-1 max-w-sm mx-auto">
      Your team database is currently empty.
    </p>
  </div>

  <!-- Employees Table -->
  <div *ngIf="employees.length > 0" class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-slate-50 border-b border-slate-200">
          <th class="text-xs font-bold text-slate-500 uppercase tracking-wider p-4 pl-6">Employee</th>
          <th class="text-xs font-bold text-slate-500 uppercase tracking-wider p-4">Age</th>
          <th class="text-xs font-bold text-slate-500 uppercase tracking-wider p-4">Department</th>
          <th class="text-xs font-bold text-slate-500 uppercase tracking-wider p-4">Joined Date</th>
          <th class="text-xs font-bold text-slate-500 uppercase tracking-wider p-4">Status</th>
          <th class="text-xs font-bold text-slate-500 uppercase tracking-wider p-4 pr-6 text-right">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        <tr *ngFor="let emp of employees" class="hover:bg-slate-50/40 transition duration-150 group">
          
          <td class="p-4 pl-6">
            <div class="flex items-center gap-3">
              <div>
                <h4 class="font-bold text-slate-800 tracking-tight leading-none mb-1">{{ emp.EmpName }}</h4>
                <span class="text-xs text-slate-400 leading-none">{{ emp.EmpEmail }}</span>
              </div>
            </div>
          </td>
          
          <td class="p-4 text-sm font-semibold text-slate-600">
            {{ emp.EmpAge }} yrs
          </td>
          
          <td class="p-4">
            <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200/50">
              {{ getDeptName(emp.DepartmentId) }}
            </span>
          </td>
          
          <td class="p-4 text-sm font-medium text-slate-500">
            {{ emp.DateOfJoining | date:'mediumDate' }}
          </td>
          
          <td class="p-4">
            <div 
             
              [ngClass]="emp.IsActive ? 'bg-emerald-50 text-emerald-700 border-emerald-100 ' : 'bg-rose-50 text-rose-700 border-rose-100 '"
              class=" select-none px-2.5 py-0.5 rounded-full text-xs font-bold inline-flex items-center gap-1.5"
            >
              <span class="w-1.5 h-1.5 rounded-full" [ngClass]="emp.IsActive ? 'bg-emerald-500' : 'bg-rose-500'"></span>
              {{ emp.IsActive ? 'Active' : 'Inactive' }}
            </div>
          </td>

          <td class="p-4 pr-6 text-right whitespace-nowrap">
            <div class="inline-flex items-center gap-1.5">
              
              <!-- Assign Project Button -->
              <button 
                (click)="assignProject.emit(emp)"
                title="Assign Project"
                class="px-2.5 py-1 text-xs font-bold border border-indigo-200 rounded-xl text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition duration-150"
              >
                Assign Project
              </button>

              <!-- View Details Action -->
              <button 
                (click)="viewDetails.emit(emp)"
                title="View Details"
                class="p-2 rounded-xl text-slate-400 hover:text-blue-600 hover:bg-blue-50 active:scale-95 transition duration-150"
              >
                <svg class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>

              <!-- Edit Details -->
              <button 
                (click)="edit.emit(emp)"
                title="Edit details"
                class="p-2 rounded-xl text-slate-400 hover:text-violet-600 hover:bg-violet-50 active:scale-95 transition duration-150"
              >
                <svg class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
              </button>

              <!-- Delete -->
              <button 
                (click)="delete.emit(emp.EmpId)"
                title="Delete employee"
                class="p-2 rounded-xl text-slate-400 hover:text-rose-600 hover:bg-rose-50 active:scale-95 transition duration-150"
              >
                <svg class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

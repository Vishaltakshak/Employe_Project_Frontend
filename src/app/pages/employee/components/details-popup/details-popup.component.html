<div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl border border-slate-100 shadow-2xl p-6 max-w-md w-full text-slate-800">
    <h3 class="text-xl font-extrabold text-slate-900 mb-4 pb-2 border-b border-slate-100 uppercase tracking-wider">
      Employee Details
    </h3>
    
    <div class="space-y-4 mb-6">
      <div class="flex flex-col">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Name</span>
        <span class="text-base font-bold text-slate-800">{{ employee?.EmpName }}</span>
      </div>
      <div class="flex flex-col">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Age</span>
        <span class="text-sm font-semibold text-slate-700">{{ employee?.EmpAge }}</span>
      </div>
      <div class="flex flex-col">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Department</span>
        <span class="text-sm font-semibold text-slate-700">{{ departmentName }}</span>
      </div>
      <div class="flex flex-col">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Date of joining</span>
        <span class="text-sm font-semibold text-slate-700">{{ employee?.DateOfJoining | date:'mediumDate' }}</span>
      </div>
      
      <div class="pt-2 border-t border-slate-100">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">.Projects</span>
        <div *ngIf="projects.length === 0" class="text-sm text-slate-400 italic py-2">
          No projects assigned.
        </div>
        <div *ngIf="projects.length > 0" class="space-y-2">
          <div *ngFor="let proj of projects" class="flex justify-between items-center bg-slate-50 border border-slate-100 p-3 rounded-2xl">
            <span class="text-sm font-bold text-slate-800">{{ proj.ProjectName }}</span>
            <span class="text-xs text-slate-500 font-medium">
              {{ (proj.AssignDate || proj.AssignedDate) | date:'mediumDate' }}
            </span>
          </div>
        </div>
      </div>
    </div>
    
    <div class="flex justify-end pt-4 border-t border-slate-100">
      <button type="button" (click)="close.emit()" class="rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-100 transition duration-150">
        Close
      </button>
    </div>
  </div>
</div>

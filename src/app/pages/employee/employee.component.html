<div class="bg-slate-50 min-h-screen text-slate-800 pb-16 font-sans">
  <app-nav-bar></app-nav-bar>

  <div class="max-w-7xl mx-auto px-8 pt-8">
    
    <!-- Title & Description Header -->
    <div class="mb-8 flex flex-row items-center justify-between gap-4">
      <div>
        <h1 class="text-4xl font-extrabold bg-gradient-to-r from-slate-900 to-indigo-950 bg-clip-text text-transparent">
          Employee Management
        </h1>
        <p class="text-sm text-slate-500 mt-1">
          Monitor your workforce, manage departments, and assign projects.
        </p>
      </div>
    </div>

    <!-- Layout Grid -->
    <div class="grid grid-cols-[380px_1fr] gap-8 mb-8">
      
      <!-- Side Form Panel -->
      <app-form-panel
        [departments]="departments"
        [isEditMode]="isEditMode"
        [employeeToEdit]="employeeToEdit"
        [isSubmitting]="isSubmitting"
        (save)="onSaveEmployee($event)"
        (clear)="onClearForm()"
      ></app-form-panel>

      <!-- Main Display / Table Section -->
      <div class="space-y-6">

        <!-- Stats Counter Bar Component -->
        <app-stats-bar [statsCards]="statsCards"></app-stats-bar>

        <!-- Employees Table Component -->
        <app-data-table
          [employees]="employees"
          [departments]="departments"
          (edit)="onEditEmployee($event)"
          (delete)="onDeleteEmployee($event)"
          (viewDetails)="onOpenDetailsPopup($event)"
          (assignProject)="onOpenProjectPopup($event)"
        ></app-data-table>

      </div>
    </div>
  </div>
</div>

<!-- Project Assignment Popup Page -->
<app-project-assignment-popup
  *ngIf="showProjectPopup"
  [employee]="projectEmp"
  [allProjects]="allProjects"
  [assignedProjects]="assignedProjects"
  (close)="onCloseProjectPopup()"
  (save)="onSaveProjectAssignments($event)"
></app-project-assignment-popup>

<!-- Employee Details Popup Page -->
<app-details-popup
  *ngIf="showDetailsPopup"
  [employee]="detailsEmp"
  [departmentName]="detailsEmp ? getDeptName(detailsEmp.DepartmentId) : ''"
  [projects]="detailsProjects"
  (close)="onCloseDetailsPopup()"
></app-details-popup>

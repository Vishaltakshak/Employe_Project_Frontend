<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 shadow-sm bg-white/95 border border-slate-200 rounded-3xl p-6">
  <div *ngFor="let card of statsCards" class="bg-slate-50/50 rounded-2xl p-4 border border-slate-100">
    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">{{ card.label }}</span>
    <h3 class="text-2xl font-extrabold text-slate-900 mt-1">{{ card.value }}</h3>
  </div>
</div>
